name: Web UI Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-automation:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2.2.0

    - name: Setup gradlew
      run: chmod +x gradlew

    - name: Execute Test
      run: ./gradlew cucumber


    - name: Archive Test
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: Cucumber Reports 
        path: report

    - name: GitHub Pages action
      if: always()
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_DIR: report
